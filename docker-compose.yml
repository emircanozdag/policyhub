services:
  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    environment:
      ORACLE_PASSWORD: oracle
      APP_USER: policyhub
      APP_USER_PASSWORD: policyhub
    ports:
      - "1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Stand-in for the third parties (vehicle registry, payment gateway); stubs live in ./wiremock/mappings
  third-parties:
    image: wiremock/wiremock:3.13.2
    command: ["--global-response-templating", "--disable-banner"]
    volumes:
      - ./wiremock:/home/wiremock:ro
    ports:
      - "8089:8080"

  app:
    build: .
    depends_on:
      oracle:
        condition: service_healthy
      third-parties:
        condition: service_started
    environment:
      DB_URL: jdbc:oracle:thin:@oracle:1521/FREEPDB1
      DB_USERNAME: policyhub
      DB_PASSWORD: policyhub
      VEHICLE_INBOUND_DIR: /data/inbound
      VEHICLE_REGISTRY_BASE_URL: http://third-parties:8080
      PAYMENT_GATEWAY_BASE_URL: http://third-parties:8080
    volumes:
      - ./samples/mainframe:/data/inbound:ro   # mainframe extracts are dropped here
    ports:
      - "8080:8080"

volumes:
  oracle-data:
