spring:
  application:
    name: policyhub
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
    username: ${DB_USERNAME:policyhub}
    password: ${DB_PASSWORD:policyhub}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway
    properties:
      hibernate:
        jdbc.time_zone: UTC
        jdbc.fetch_size: 100   # Oracle's driver default of 10 rows per round trip is far too low
  flyway:
    enabled: true
    locations: classpath:db/migration
  batch:
    job:
      enabled: false          # jobs are launched by the scheduler or the batch API, never at startup
    jdbc:
      initialize-schema: never  # batch metadata tables are created by Flyway (V2)

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,circuitbreakers,retries
  health:
    circuitbreakers:
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

policyhub:
  quote:
    validity-days: 15
  integration:
    vehicle-registry:
      base-url: ${VEHICLE_REGISTRY_BASE_URL:http://localhost:8089}
      api-key: ${VEHICLE_REGISTRY_API_KEY:}
      connect-timeout: 1s
      read-timeout: 2s       # quoting is interactive; the local copy is a better answer than a slow one
    payment-gateway:
      base-url: ${PAYMENT_GATEWAY_BASE_URL:http://localhost:8089}
      api-key: ${PAYMENT_GATEWAY_API_KEY:}
      connect-timeout: 1s
      read-timeout: 10s      # card authorisation (3-D Secure, bank) is legitimately slower
  batch:
    vehicle-import:
      inbound-dir: ${VEHICLE_INBOUND_DIR:./samples/mainframe}
      encoding: UTF-8
      chunk-size: 500
      skip-limit: 100
    lifecycle:
      schedule-enabled: true
      cron: "0 0 2 * * *"     # 02:00 Europe/Istanbul
      renewal-window-days: 30
      chunk-size: 100

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        slow-call-duration-threshold: 3s
        slow-call-rate-threshold: 80
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - com.policyhub.integration.ThirdPartyUnavailableException
        register-health-indicator: true
        # An open circuit means "degraded", not "dead": it must not fail the app's health check
        # and get healthy pods restarted by the orchestrator.
        allow-health-indicator-to-fail: false
    instances:
      vehicle-registry:
        base-config: default
      payment-gateway:
        base-config: default
        slow-call-duration-threshold: 8s
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - com.policyhub.integration.ThirdPartyUnavailableException
    instances:
      vehicle-registry:
        base-config: default
      payment-gateway:
        base-config: default
        wait-duration: 500ms   # only safe because every attempt carries the same Idempotency-Key
